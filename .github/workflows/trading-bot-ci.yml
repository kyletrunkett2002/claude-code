name: trading-bot CI

# Scoped to the trading-bot/ project only, so it never runs for unrelated
# changes elsewhere in the repository.
on:
  push:
    branches: ["**"]
    paths:
      - "trading-bot/**"
      - ".github/workflows/trading-bot-ci.yml"
  pull_request:
    paths:
      - "trading-bot/**"
      - ".github/workflows/trading-bot-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: trading-bot
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify zero runtime dependencies
        # The framework must import using only the standard library.
        run: python -c "import tradebot; print('tradebot', tradebot.__version__)"

      - name: Run test suite (no pytest, stdlib only)
        run: python tests/test_tradebot.py

      - name: Run test suite under pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest -q

      - name: Smoke-test the CLI end to end
        run: |
          python -m tradebot compare --synthetic 400
          python -m tradebot backtest -s supertrend --synthetic 400
          python -m tradebot walkforward -s sma --synthetic 600 --folds 3
          python -m tradebot montecarlo -s sma --synthetic 600 --sims 500
