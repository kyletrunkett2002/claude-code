[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "A small, dependency-free crypto trading bot framework: backtest, optimize, validate, paper-trade."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["trading", "crypto", "backtest", "quant", "bot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial :: Investment",
]
# Zero runtime dependencies — standard library only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
include = ["tradebot*"]
